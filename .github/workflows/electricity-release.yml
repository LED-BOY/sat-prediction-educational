name: Package Smart Electricity Scheduler
on:
  push:
    tags:
      - 'electricity-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package app
        run: zip -r smart-electricity-sat.zip smart-electricity-sat -x '*/__pycache__/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="electricity-v1.0.0"
            git tag "${TAG}" || true
            git push origin "${TAG}" || true
          fi
          gh release create "${TAG}" smart-electricity-sat.zip --title "Smart Electricity Scheduler ${TAG}" --notes "Experimental CP-SAT smart electricity scheduling app with SAT ML transfer and benchmark."
